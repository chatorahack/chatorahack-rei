# file: .rei/owners.cfg
# template: REI
# title: ファイルの持ち主の表
# description: 版を上げるとき、どのファイルがプロジェクトのものか・両方が書くものかを道具に教える
# caution: 雛形の持ち物。プロジェクトでは書き換えない
#
# ファイルの持ち主の表（雛形の持ち物。プロジェクトで書き換えない）。書式は git の設定ファイルと同じ。
# 版を上げるとき（scripts/upgrade-plan.sh）に、ファイルをどう当てるかを決める。docs/howto/upgrade.md「ファイルの持ち主」。
#   project … プロジェクトが書いていくファイル。雛形で変わっても上書きも3方向もしない。「見る」と出すので、差分を読んで要るところだけ手で足す
#   shared  … 雛形とプロジェクトの両方が書くファイル。3方向（git merge-file）で当て、当てたあとに書式を確かめる
#   .rei/received.cfg（受け取りの記録）… 表に書かない。当てずに残し、最後に版を書く（upgrade-plan.sh。v0.3.0-beta.32）
#   ここに無いファイル … 雛形の持ち物。プロジェクトで手を加えていなければ入れ替え、加えていれば3方向
# path は * を使える（bash の case と同じ）。知らない節は読み飛ばしてよい。
[owner "project"]
	path = GOAL.md
	path = START.md
	path = handoff.md
	path = CHANGELOG.md
	path = ledger/task_log.md
	path = ledger/issue_log.md
	path = ledger/incident_log.md
	path = ledger/worklog/2*.md
[owner "shared"]
	path = AGENTS.md
	path = CLAUDE.md
	path = .claude/settings.json
