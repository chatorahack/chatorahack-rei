# file: .rei/received.cfg
# template: REI
# title: 受け取りの記録
# description: このプロジェクトが REI のどの版を、いつ、どこから受け取ったか
# caution: git config --file で読み書きする。手元のパスは書かない
#
# REI から受け取ったものの記録（受け取りの記録）。書式は git の設定ファイルと同じ。
# 読む・書くときは git を使う：git config --file .rei/received.cfg template.version
# 項目の意味と、版を上げたときの直し方は docs/howto/upgrade.md「受け取りの記録」。
# 知らない節（[...]）や項目は読み飛ばしてよい（後の版で増えることがある）。
[rei]
	format = 1
[template]
	version = 0.3.0-beta.38
	commit =
	source = chatorahack/chatorahack-rei
	applied =
	decision =
	claude-code =
# 雛形から受け取らないと決めたファイル（1つに1節。版を上げるとき upgrade-plan.sh が「受け取らない」と出し、数えない）：
#   git config --file .rei/received.cfg 'skip.docs/glossary.md.reason' '辞書はプロジェクト独自'
#   → [skip "docs/glossary.md"] reason = 用語集はプロジェクト独自
# 版を選んで先に取り込んだ印（upgrade-plan.sh --only。version より新しい版だけ。v0.3.0-beta.30）：
#   git config --file .rei/received.cfg 'picked.0.3.0-beta.31.applied' YYYY-MM-DD
#   → [picked "0.3.0-beta.31"] applied = YYYY-MM-DD
# 後の版で使う予定の節（今は書かない・読まない）：
#   [vendor "<写した先のパス>"] source = … path = … commit = … sha256 = …   ほかのリポジトリから写したファイル
#   [feature "<機能の名前>"] version = … commit = …   機能ごとに受け取った版
