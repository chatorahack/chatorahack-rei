# file: changes.cfg
# template: REI
# title: REI の変更の索引
# description: 版ごとの機能の名前と重さ（必須・推奨・任意）・手作業。版上げの道具と起動の知らせが読む
# caution: 人が読む正本は CHANGELOG.md
#
# REI の変更の索引（機械が読む。人が読む正本は CHANGELOG.md）。書式は git の設定ファイルと同じ。
# 読み方：git config --file changes.cfg --get-regexp '^change\..*\.severity$'
# 1つの版に1つの変更（一因子）なので、1つの節＝1つの版。CHANGELOG.md の見出しの版は、全部ここにも置く。
#   feature  … 機能の名前（template/docs/naming.md「REI の機能の名前」）
#   severity … required（必須：入れないと、止めるべきときに止まらない・外への書き込みを見逃す・守るべきものを守れない）
#              recommended（推奨：決まり・手順が良くなる）
#              optional（任意：文書・例だけで、動きは変わらない）
#   reason   … required のときに書く。なぜ必須か（v0.3.0-beta.28 から）
#   manual   … 上げるときに手作業が要るとき、何をするか（v0.3.0-beta.28 から）
# 後の版で使う予定の項目（今は書かない）：breaks（壊すもの）、requires（前提の版）
# beta.1〜beta.23 の重さは後から付けた（beta.13・16 を recommended に、beta.2 を required に）。
